<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שלב 2 - המלצת גודל מערכת - בראשית סולאר</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Custom Styles (inlined) -->
    <style>
/* ========================================
   מערכת סולארית - עיצוב מקצועי
   ======================================== */

:root {
    /* Primary Colors */
    --primary: #1a3a5f;
    --primary-light: #2980b9;
    --primary-dark: #0f2744;
    
    /* Accent Colors */
    --accent: #f39c12;
    --accent-light: #f5b041;
    --accent-dark: #d68910;
    
    /* Status Colors */
    --success: #27ae60;
    --success-light: #58d68d;
    --warning: #f39c12;
    --danger: #e74c3c;
    --info: #3498db;
    --purple: #8e44ad;
    
    /* Neutral Colors */
    --bg: #f4f7fa;
    --bg-card: #ffffff;
    --bg-section: #f8fafc;
    --border: #e2e8f0;
    --border-dark: #cbd5e1;
    --text: #2c3e50;
    --text-muted: #7f8c8d;
    --text-light: #95a5a6;
    
    /* Effects */
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
    --shadow-xl: 0 20px 50px rgba(0,0,0,0.15);
    --radius-sm: 4px;
    --radius: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    
    /* Transitions */
    --transition: all 0.2s ease;
    --transition-slow: all 0.3s ease;
}

/* Reset */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    direction: rtl;
    overflow-x: hidden;
}

/* App Container */
.app-container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Header */
.app-header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
    color: white;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
}
.header-content {
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1600px;
    margin: 0 auto;
}
.logo-section { display: flex; align-items: center; gap: 15px; }
.logo-icon {
    font-size: 2.5rem;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.logo-text h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 2px;
}
.logo-text p {
    font-size: 0.85rem;
    opacity: 0.85;
}
.settings-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: var(--transition);
    backdrop-filter: blur(10px);
}
.settings-btn:hover {
    background: rgba(255,255,255,0.25);
    transform: translateY(-1px);
}

/* Step Tabs */
.step-tabs {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 0 30px 15px;
    max-width: 1600px;
    margin: 0 auto;
}
.step-tab {
    background: rgba(255,255,255,0.1);
    border: none;
    color: rgba(255,255,255,0.7);
    padding: 12px 30px;
    border-radius: var(--radius) var(--radius) 0 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    transition: var(--transition);
    min-width: 200px;
    justify-content: center;
}
.step-tab:hover:not(.active) {
    background: rgba(255,255,255,0.15);
    color: white;
}
.step-tab.active {
    background: white;
    color: var(--primary);
    box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
}
.step-tab.done { background: var(--success-light); color: var(--success); }
.step-number {
    background: currentColor;
    color: var(--bg-card);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 700;
}
.step-tab:not(.active) .step-number { color: rgba(255,255,255,0.9); }

/* Main Content */
.main-content {
    flex: 1;
    max-width: 1600px;
    margin: 0 auto;
    padding: 30px;
    width: 100%;
}
.step-content { display: none; animation: fadeIn 0.4s ease; }
.step-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.step-header {
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 2px solid var(--border);
}
.step-header h2 {
    color: var(--primary);
    font-size: 1.5rem;
    margin-bottom: 5px;
}
.step-description {
    color: var(--text-muted);
    font-size: 0.95rem;
}

/* Cards */
.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 25px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
    transition: var(--transition);
}
.card:hover { box-shadow: var(--shadow); }
.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border);
}
.card-title {
    color: var(--primary);
    font-size: 1.15rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
}
.card-grid-2 { grid-template-columns: 1fr 1fr; }
.card-grid-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 768px) { .card-grid-2, .card-grid-3 { grid-template-columns: 1fr; } }

/* Form Elements */
.form-group { margin-bottom: 15px; }
.form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
}
.form-control {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-family: inherit;
    transition: var(--transition);
    background: white;
}
.form-control:focus {
    outline: none;
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(41,128,185,0.1);
}
.form-control:disabled { background: var(--bg-section); color: var(--text-light); }
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.form-help {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.4;
}
.form-error {
    color: var(--danger);
    font-size: 0.85rem;
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
}

/* Buttons */
.btn {
    border: none;
    border-radius: var(--radius);
    padding: 12px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    font-family: inherit;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary-light); color: white; }
.btn-primary:hover:not(:disabled) { background: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow); }
.btn-accent { background: var(--accent); color: white; }
.btn-accent:hover:not(:disabled) { background: var(--accent-dark); }
.btn-success { background: var(--success); color: white; }
.btn-success:hover:not(:disabled) { background: #219a52; }
.btn-danger { background: var(--danger); color: white; }
.btn-secondary { background: var(--text-muted); color: white; }
.btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover:not(:disabled) { background: var(--primary); color: white; }
.btn-lg { padding: 15px 30px; font-size: 1.05rem; }
.btn-sm { padding: 6px 12px; font-size: 0.85rem; }
.btn-block { width: 100%; }
.btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}

/* File Upload */
.file-upload {
    border: 2.5px dashed var(--border-dark);
    border-radius: var(--radius-lg);
    padding: 30px;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    background: var(--bg-section);
}
.file-upload:hover, .file-upload.dragover {
    border-color: var(--primary-light);
    background: rgba(41,128,185,0.05);
}
.file-upload input[type="file"] { display: none; }
.file-upload-icon { font-size: 2.5rem; margin-bottom: 10px; }
.file-upload-text { color: var(--text); font-weight: 600; }
.file-upload-hint { color: var(--text-muted); font-size: 0.85rem; margin-top: 5px; }
.file-name {
    margin-top: 10px;
    padding: 8px 12px;
    background: white;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    display: inline-block;
    font-size: 0.9rem;
    color: var(--success);
    font-weight: 600;
}

/* Customer Info Bar */
.customer-info-bar {
    background: linear-gradient(135deg, #eafaf1 0%, #d4f4dd 100%);
    border: 1px solid var(--success-light);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: none;
    margin-bottom: 20px;
}
.customer-info-bar.show { display: block; }
/* הורחב: רשת קלטי ייצור (שטח גג/הספק קיים/אזימוט/הצללה) */
.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 15px;
}
/* הורחב: סיכום תוצאות ייצור (קיים/חדש-מקסימלי/סה"כ) */
.results-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 15px;
}
.summary-item {
    text-align: center;
    padding: 12px;
    background: var(--bg-section);
    border-radius: var(--radius);
}
.summary-item.highlight {
    background: #e9f7ef;
    border: 1.5px solid var(--success);
}
.summary-label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 4px;
}
.summary-value {
    display: block;
    font-size: 1.1rem;
    color: var(--primary);
    font-weight: 800;
}
.summary-item.highlight .summary-value { color: var(--success); }
.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
}
.info-item {
    text-align: center;
}
.info-label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
}
.info-value {
    display: block;
    font-size: 1rem;
    color: var(--primary);
    font-weight: 700;
}

/* Tables */
.data-table-wrapper {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-top: 15px;
}
.table-scroll {
    max-height: 400px;
    overflow: auto;
}
.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
    text-align: center;
}
.data-table thead {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--primary);
    color: white;
}
.data-table th {
    padding: 12px 8px;
    font-weight: 700;
    text-align: center;
    border: 1px solid var(--primary-dark);
}
.data-table td {
    padding: 9px 8px;
    border: 1px solid var(--border);
    color: var(--text);
}
.data-table tr:nth-child(even) { background: var(--bg-section); }
.data-table tr:hover { background: #e8f4fd; }
.data-table .day-header { background: #95a5a6; color: white; font-weight: 600; }
.data-table .peak { color: var(--danger); font-weight: 700; background: #fdedec; }
.data-table .offpeak { color: var(--success); font-weight: 600; background: #e9f7ef; }

/* Analytics Cards */
.analytics-row {
    display: flex;
    align-items: center;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 20px 25px;
    margin-bottom: 15px;
    box-shadow: var(--shadow-sm);
    position: relative;
    gap: 0;
    flex-wrap: wrap;
}
.analytics-row::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 5px;
    border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
}
.analytics-row.combined::before { background: var(--info); }
.analytics-row.winter::before { background: var(--purple); }
.analytics-row.summer::before { background: var(--accent); }
.analytics-row.transition::before { background: var(--success); }

.analytics-label {
    width: 100%;
    text-align: right;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
}
.analytics-label.combined { color: var(--info); }
.analytics-label.winter { color: var(--purple); }
.analytics-label.summer { color: var(--accent); }
.analytics-label.transition { color: var(--success); }

.metric-card {
    flex: 1;
    text-align: center;
    padding: 8px 15px;
    border-right: 1px solid var(--border);
    min-width: 110px;
}
.metric-card:last-child { border-right: none; }
.metric-name {
    display: block;
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
    font-weight: 600;
}
.metric-value {
    display: block;
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--primary);
}

/* Input Source Cards */
.input-source-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}
/* הורחב: קטגוריות עליונות (חח"י מול אפשרויות אחרות) */
.input-category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}
.input-category {
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 15px;
    cursor: pointer;
    text-align: center;
    transition: var(--transition);
    background: white;
}
.input-category:hover { border-color: var(--primary-light); box-shadow: var(--shadow); }
.input-category.active { border-color: var(--primary); background: rgba(41,128,185,0.05); }
.input-category .input-source-icon { font-size: 2.2rem; }
.input-category .input-source-title { font-size: 1.05rem; }
.input-source {
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 15px;
    cursor: pointer;
    text-align: center;
    transition: var(--transition);
    background: white;
}
.input-source:hover { border-color: var(--primary-light); }
.input-source.active { border-color: var(--primary-light); background: rgba(41,128,185,0.05); }
.input-source-icon { font-size: 1.8rem; margin-bottom: 5px; }
.input-source-title { font-weight: 700; color: var(--primary); margin-bottom: 3px; }
.input-source-desc { font-size: 0.8rem; color: var(--text-muted); }

/* Reports Window */
.reports-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-top: 20px;
}
.report-window {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
}
.report-window-wide { grid-column: span 2; }
@media (max-width: 1024px) { .report-window-wide { grid-column: span 1; } }
.report-header {
    background: var(--bg-section);
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    color: var(--primary);
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* Battery Cubes */
.battery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 20px;
}
.battery-cube {
    background: white;
    border: 2px solid var(--primary-light);
    border-radius: var(--radius);
    padding: 15px 10px;
    text-align: center;
    transition: var(--transition);
    cursor: pointer;
    position: relative;
}
.battery-cube:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: var(--accent);
}
.battery-cube.selected {
    background: linear-gradient(135deg, #e8f4fd 0%, #d6eaf8 100%);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(41,128,185,0.2);
}
.battery-cube.recommended {
    border-color: var(--success);
    background: linear-gradient(135deg, #eafaf1 0%, #d4f4dd 100%);
}
.cube-best-badge {
    position: absolute;
    top: -10px;
    right: 50%;
    transform: translateX(50%);
    background: var(--success);
    color: white;
    font-size: 0.7rem;
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 700;
}
.cube-size {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 8px;
}
.cube-size small {
    display: block;
    font-size: 0.65rem;
    color: var(--text-muted);
    font-weight: 600;
    margin-top: 2px;
}
.cube-savings {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--success);
}
.cube-savings small {
    display: block;
    font-size: 0.65rem;
    color: var(--text-muted);
    font-weight: 500;
    margin-top: 2px;
}

/* Charts */
.chart-container {
    background: white;
    border-radius: var(--radius-lg);
    padding: 20px;
    border: 1px solid var(--border);
    margin: 15px 0;
    height: 400px;
    position: relative;
}
.chart-container-small { height: 250px; }
.chart-container-large { height: 500px; }

/* Recommendation Cards */
.rec-card {
    border-radius: var(--radius-lg);
    padding: 25px;
    color: var(--text);
    border: 2px solid;
    position: relative;
    overflow: hidden;
}
.rec-card.solar {
    background: linear-gradient(135deg, #eaf4fd 0%, #d6eaf8 100%);
    border-color: var(--info);
}
.rec-card.battery {
    background: linear-gradient(135deg, #f0e8ff 0%, #e0d0f5 100%);
    border-color: var(--purple);
}
.rec-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.rec-size {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--primary);
    text-align: center;
    margin: 15px 0;
}
.rec-size small {
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
}
.rec-rows { margin-top: 15px; }
.rec-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px dashed rgba(0,0,0,0.08);
    font-size: 0.88rem;
}
.rec-row:last-child { border-bottom: none; }
.rec-row-label { color: var(--text-muted); }
.rec-row-value { font-weight: 700; color: var(--primary); }

/* Results Table */
.results-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    margin-top: 15px;
}
.results-table thead { background: var(--primary); color: white; }
.results-table th {
    padding: 14px 12px;
    text-align: center;
    font-weight: 700;
    border: 1px solid var(--primary-dark);
}
.results-table td {
    padding: 12px;
    border: 1px solid var(--border);
    text-align: center;
}
.results-table tr:nth-child(even) td { background: var(--bg-section); }
.results-table .highlight { color: var(--success); font-weight: 800; background: #e9f7ef; }
.results-table .assumption { color: var(--info); font-size: 0.8rem; }

/* Modals */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);

/* ===== parser.js ===== */
/* ====================================================================
   PARSER - מנוע פענוח קבצי צריכה
   תומך ב:
   - CSV/Excel גולמי מחברת החשמל (מונים מרובים)
   - JSON מטופס סקר מכשירים (מוצפן AES-GCM)
   - זיהוי אוטומטי של מבנה העמודות
   - ניקוי כפילויות מונים
   - סינתזת נתונים ממטריצה/סך שנתי
   ==================================================================== */

const DataParser = (function() {
    
    const C = AppConstants;
    
    /**
     * פענוח תאריך בפורמט ישראלי DD/MM/YYYY
     */
    function parseIsraelDate(dateStr, timeStr) {
        if (!dateStr || !timeStr) return null;
        const dp = dateStr.trim().split('/');
        const tp = timeStr.trim().split(':');
        if (dp.length !== 3 || tp.length < 2) return null;
        
        let y = parseInt(dp[2], 10);
        if (y < 2000) y += 2000;
        const m = parseInt(dp[1], 10) - 1;
        const d = parseInt(dp[0], 10);
        const h = parseInt(tp[0], 10);
        const min = parseInt(tp[1], 10);
        const date = new Date(y, m, d, h, min);
        if (isNaN(date.getTime())) return null;
        return date;
    }
    
    /**
     * סיווג שעה כפסגה או שפל לפי תקנות רשות החשמל
     * הערה: אנומליית החורף - פסגה גם בשישי-שבת 17-22
     */
    function classifyHour(dateObj) {
        const month = dateObj.getMonth() + 1;
        const dow = dateObj.getDay();
        const hour = dateObj.getHours();
        
        let season;
        if (month === 12 || month === 1 || month === 2) season = 'winter';
        else if (month >= 6 && month <= 9) season = 'summer';
        else season = 'transition';
        
        const isHoliday = C.HOLIDAYS.includes(formatDateISO(dateObj));
        const isShabbatOrFriday = dow === 5 || dow === 6;
        const isWinterShabbat = season === 'winter' && isShabbatOrFriday;
        
        let isPeak = false;
        if (season === 'winter') {
            // חורף: פסגה 17-22 בכל הימים (כולל שישי-שבת) - אנומליה מתועדת
            isPeak = (hour >= 17 && hour < 22);
        } else if (season === 'summer') {
            // קיץ: פסגה 17-23 רק בימי חול (ללא שישי-שבת וחגים)
            if (!isShabbatOrFriday && !isHoliday) {
                isPeak = (hour >= 17 && hour < 23);
            }
        } else {
            // מעבר: פסגה 17-22 רק בימי חול (ללא שישי-שבת וחגים)
            if (!isShabbatOrFriday && !isHoliday) {
                isPeak = (hour >= 17 && hour < 22);
            }
        }
        
        return { season, isPeak, isShabbat: isShabbatOrFriday, isHoliday };
    }
    
    function formatDateISO(d) {
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    
    /**
     * חישוב מספר ימי פסגה בשנה מסוימת (לפי לוח שנה)
     * שיטה: ספירה בפועל של ימים שבהם יש לפחות שעת פסגה אחת
     */
    function computeSeasonalPeakDayCounts(year) {
        const days = { winter: 0, summer: 0, transition: 0 };
        const seen = { winter: new Set(), summer: new Set(), transition: new Set() };
        const start = new Date(year, 0, 1, 0, 0, 0);
        const end = new Date(year + 1, 0, 1, 0, 0, 0);
        const cursor = new Date(start);
        
        while (cursor < end) {
            for (let h = 17; h < 23; h++) {
                const probe = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate(), h);
                const { season, isPeak } = classifyHour(probe);
                if (isPeak) seen[season].add(probe.toDateString());
            }
            cursor.setDate(cursor.getDate() + 1);
        }
        
        days.winter = seen.winter.size;
        days.summer = seen.summer.size;
        days.transition = seen.transition.size;
        return days;
    }
    
    /**
     * פענוח קובץ CSV/Excel גולמי של חח"י
     * תומך ב: מונה צריכה רגיל, מונה ייצור, מונה דו-כיווני, כפילויות
     */
    function parseMeterFile(rows) {
        if (!rows || rows.length === 0) return null;
        
        // חילוץ metadata של לקוח
        const customer = extractCustomerMetadata(rows);
        
        // מציאת אינדקס התחלת הנתונים
        const dataStart = findDataStartIndex(rows);
        if (dataStart === -1) {
            return { customer, rawSeries: [], error: 'לא נמצאה עמודת "קוד ומספר מונה"' };
        }
        
        // בניית מפת חותמות-זמן (מאוחדת מונים כפולים)
        const timeSlots = new Map();  // key: timestamp
        const slotMeta = new Map();   // key: timestamp, value: {hasMulti, hasSolar}
        const meterTypes = new Set();
        let hasAnySolarMeter = false;
        let totalGenKwh = 0;
        let peakSolarKw = 0;
        
        for (let i = dataStart; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 5) continue;
            
            const meterType = (row[1] || '').toString().trim();
            const dateStr = row[2];
            const timeStr = row[3];
            if (!dateStr || !timeStr) continue;
            
            const val1 = parseFloat(String(row[4]).replace(/[",]/g, '')) || 0;
            const val2 = row.length > 5 ? (parseFloat(String(row[5]).replace(/[",]/g, '')) || 0) : 0;
            
            const dateObj = parseIsraelDate(dateStr, timeStr);
            if (!dateObj) continue;
            
            const tsKey = dateObj.getTime();
            meterTypes.add(meterType);
            
            // ספירת ייצור לזיהוי מערכת סולארית קיימת
            if (meterType.includes('ייצור')) {
                totalGenKwh += val1;
                if (val1 > peakSolarKw) peakSolarKw = val1;
            }
            
            if (!timeSlots.has(tsKey)) {
                timeSlots.set(tsKey, {
                    importKwh: [],    // רשת: משיכה
                    exportKwh: [],    // רשת: הזרמה
                    genKwh: [],       // ייצור סולארי
                    consumption: [],  // צריכה רגילה (מונה נפרד)
                    dateObj
                });
            }
            const slot = timeSlots.get(tsKey);
            
            // סיווג לפי סוג מונה
            if (meterType.includes('דו-כיווני') || meterType.includes('דו כיווני')) {
                slot.importKwh.push(val1);
                slot.exportKwh.push(val2);
                hasAnySolarMeter = true;
            } else if (meterType.includes('ייצור')) {
                slot.genKwh.push(val1);
                hasAnySolarMeter = true;
            } else if (meterType.includes('צריכה') || meterType === '') {
                slot.consumption.push(val1);
            } else {
                // סוג לא מזוהה - נניח שזה צריכה (בטיחות)
                slot.consumption.push(val1);
            }
        }
        
        // עיבוד החותמות-זמן: חישוב צריכה אמיתית
        const rawSeries = [];
        for (const [ts, slot] of timeSlots.entries()) {
            // אם יש מונה דו-כיווני (הזרמה+משיכה) - זה מקור הצריכה העיקרי
            // אם יש מונה ייצור - הוא מוסיף לייצור בפועל
            // אם יש מונה צריכה רגיל - זה מונה הצריכה
            
            let actualKwh = 0;
            let existingProductionKwh = 0;
            let hasMulti = false;
            
            if (slot.importKwh.length > 0) {
                // מונה דו-כיווני: צריכה = משיכה + (ייצור - הזרמה) [אם יש ייצור]
                const importAvg = average(slot.importKwh);
                const exportAvg = slot.exportKwh.length > 0 ? average(slot.exportKwh) : 0;
                const genAvg = slot.genKwh.length > 0 ? average(slot.genKwh) : 0;
                // הצריכה האמיתית = מה שמשכנו מהרשת + מה שייצרנו וצרכנו בעצמנו
                actualKwh = Math.max(0, importAvg + Math.max(0, genAvg - exportAvg));
                existingProductionKwh = genAvg;
                hasMulti = slot.importKwh.length > 1 || slot.genKwh.length > 1 || slot.exportKwh.length > 1;
            } else if (slot.consumption.length > 0) {
                actualKwh = average(slot.consumption);
                hasMulti = slot.consumption.length > 1;
            }
            // תוקן/הורחב: מונה "ייצור" נפרד (לא דו-כיווני) גם הוא מייצג ייצור
            // קיים בפועל - קודם לא נחשף כלל בתוצאה (רק שימש לזיהוי hasSolar).
            if (slot.genKwh.length > 0 && slot.importKwh.length === 0) {
                existingProductionKwh = average(slot.genKwh);
            }
            
            const { season, isPeak, isShabbat, isHoliday } = classifyHour(slot.dateObj);
            rawSeries.push({
                date: slot.dateObj,
                kwh: actualKwh,
                existingProductionKwh,
                isPeak,
                season,
                isShabbat,
                isHoliday,
                isMultiMeter: hasMulti
            });
        }
        
        // מיון לפי תאריך
        rawSeries.sort((a, b) => a.date - b.date);
        
        return {
            customer,
            rawSeries,
            hasSolar: hasAnySolarMeter,
            inferredSolarKw: hasAnySolarMeter ? Math.round(peakSolarKw * 2 * 10) / 10 : 0,
            meterTypes: Array.from(meterTypes),
            dataPointCount: rawSeries.length
        };
    }
    
    /**
     * חילוץ metadata (שם, כתובת, חוזה) מתוך שורות הקובץ
     */
    function extractCustomerMetadata(rows) {
        let name = '-', address = '-', contract = '-';
        const meterTypes = [], meterCodes = [], meterNums = [];
        
        for (let i = 0; i < Math.min(30, rows.length); i++) {
            const row = rows[i];
            if (!row || !row[0]) continue;
            const cell0 = String(row[0]);
            
            if (cell0.includes('שם לקוח') && rows[i + 2]) {
                name = rows[i + 2][0] || '-';
                address = rows[i + 2][1] || '-';
                contract = rows[i + 2][2] || '-';
            }
            
            if (cell0.includes('סוג מונה') && rows[i + 2]) {
                let j = i + 2;
                while (j < rows.length && rows[j] && rows[j][0] && 
                       !String(rows[j][0]).includes('___') && 
                       !String(rows[j][0]).includes('קוד ומספר')) {
                    if (String(rows[j][0]).trim() !== '') {
                        meterTypes.push(rows[j][0]);
                        meterCodes.push(rows[j][1]);
                        meterNums.push(rows[j][2]);
                    }
                    j++;
                }
            }
        }
        
        return {
            name, address, contract,
            type: meterTypes.join(' + ') || '-',
            code: meterCodes.join(', ') || '-',
            number: meterNums.join(', ') || '-'
        };
    }
    
    /**
     * מציאת אינדקס שורת הנתונים הראשונה (אחרי "קוד ומספר מונה")
     */
    function findDataStartIndex(rows) {
        for (let i = 0; i < rows.length; i++) {
            if (rows[i] && rows[i][0] && String(rows[i][0]).includes('קוד ומספר מונה')) {
                return i + 1;
            }
        }
        return -1;
    }
    
    function average(arr) {
        if (arr.length === 0) return 0;
        return arr.reduce((s, v) => s + v, 0) / arr.length;
    }
    
    /**
     * זיהוי אוטומטי של עמודות תאריך/שעה/צריכה
     * לתמיכה בקבצי Excel לא סטנדרטיים
     */
    function detectGenericColumns(rows) {
        for (let i = 0; i < Math.min(10, rows.length); i++) {
            const row = rows[i];
            if (!row) continue;
            const joined = row.map(v => (v || '').toString()).join('|');
            if (joined.includes('תאריך') && 
                (joined.includes('שעה') || joined.includes('שימוש') || joined.includes('צריכה'))) {
                return i + 1;
            }
        }
        return -1;
    }
    
    /**
     * הוחלף במלואו: הפונקציה הקודמת נבנתה מול סכימת JSON משוערת
     * (consumers[] עם dayNum/startHour/duration) שמעולם לא תאמה את הטופס
     * האמיתי, ומול הצפנת AES-GCM עם מפתח קבוע וגלוי בקוד (לא סודיות אמיתית).
     * כעת: פענוח תואם למעטפת ה-RSA-OAEP+AES-GCM האמיתית של הטופס
     * (מפתח פרטי מוזן בזמן ריצה, לעולם לא קבוע בקוד), ופיענוח הסכימה
     * האמיתית (client/billing/hourlySeries/rawConsumers) - ראו
     * decryptConsumptionEnvelope ו-buildSeriesFromSurveyPayload למטה.
     */
    function _pemOrB64ToArrayBuffer(input) {
        const clean = input
            .replace(/-----BEGIN PRIVATE KEY-----/g, '')
            .replace(/-----END PRIVATE KEY-----/g, '')
            .replace(/\s+/g, '');
        const bin = atob(clean);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        return buf.buffer;
    }
    function _b64ToArrayBuffer(b64) {
        const bin = atob(b64);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        return buf.buffer;
    }

    /**
     * פענוח מעטפת קובץ .json.enc מטופס נתוני הצריכה (בראשית סולאר)
     * תואם בדיוק את encryptPayloadForSystem() בטופס: מפתח AES-256-GCM
     * אקראי-לקובץ, עטוף (wrapped) ב-RSA-OAEP-2048-SHA256 עם המפתח הפרטי.
     * המפתח הפרטי מוזן בזמן ריצה ע"י המשתמש (לעולם לא קבוע בקוד).
     * @param {Object} envelope - {iv, encryptedKey, ciphertext} (בסיס64)
     * @param {string} privateKeyInput - PEM או בסיס64 חד-שורתי (PKCS8)
     * @returns {Promise<Object>} האובייקט המפוענח (payload)
     */
    async function decryptConsumptionEnvelope(envelope, privateKeyInput) {
        if (!envelope || !envelope.iv || !envelope.encryptedKey || !envelope.ciphertext) {
            throw new Error('מבנה קובץ מוצפן לא תקין - חסרים iv/encryptedKey/ciphertext');
        }
        let privKey;
        try {
            privKey = await crypto.subtle.importKey(
                'pkcs8', _pemOrB64ToArrayBuffer(privateKeyInput),
                { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']
            );
        } catch (e) {
            throw new Error('מפתח פרטי לא תקין: ' + e.message);
        }
        let rawAesKey;
        try {
            rawAesKey = await crypto.subtle.decrypt(
                { name: 'RSA-OAEP' }, privKey, _b64ToArrayBuffer(envelope.encryptedKey)
            );
        } catch (e) {
            throw new Error('פענוח מפתח ה-AES נכשל - ודאו שהמפתח הפרטי תואם למפתח הציבורי שבטופס');
        }
        const aesKey = await crypto.subtle.importKey('raw', rawAesKey, 'AES-GCM', false, ['decrypt']);
        const iv = new Uint8Array(_b64ToArrayBuffer(envelope.iv));
        let plainBuf;
        try {
            plainBuf = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv }, aesKey, _b64ToArrayBuffer(envelope.ciphertext)
            );
        } catch (e) {
            throw new Error('פענוח התוכן נכשל - ייתכן שהקובץ פגום או שהמפתח שגוי');
        }
        return JSON.parse(new TextDecoder().decode(plainBuf));
    }

    /**
     * הוחלף: הגרסה הקודמת בנתה סדרה שעתית עצמאית משולבת (צורת מכשירים +
     * כיול מול חיוב). תוקן לפי הנחיה מפורשת - יבוא ה-JSON אמור "להתחבר"
     * לסקציה הקיימת "סך צריכה שנתית + סוג נכס" ולא להוות נתיב חישוב נפרד.
     * כעת מחלץ רק שני ערכים (סך שנתי, סוג נכס) להזנה ישירה ל-synthesizeFromAnnual -
     * בדיוק כפי שקורה בהזנה ידנית של אותה סקציה. שדה client.propertyType
     * מהטופס תואם כעת במדויק את מפתחות C.PROPERTY_TYPES (אין צורך במיפוי).
     * @param {Object} payload - הפלט המפוענח/הגולמי מהטופס
     * @returns {{annualKwh: number, propertyType: string, warnings: Array<string>}}
     */
    function extractAnnualEstimateFromSurveyPayload(payload) {
        const billing = payload.billing || {};
        const client = payload.client || {};
        const warnings = [];

        function nisToKwh(nis) {
            if (nis === null || nis === undefined) return null;
            const vatFactor = 1 + C.TAX.vatRate;
            if (client.meterType === 'toz') {
                const avg = (C.TOU.summer_peak + C.TOU.summer_low + C.TOU.winter_peak
                    + C.TOU.winter_low + C.TOU.transition_peak + C.TOU.transition_low) / 6;
                return nis / (avg * vatFactor);
            }
            const flatRate = C.TOU.winter_low * vatFactor;
            return nis / flatRate;
        }

        // עדיפות: קוט"ש שנתי ישיר > ₪ שנתי (מומר) > סכום חודשים ידועים > סכום מכשירים (fallback אחרון)
        let annualKwh = billing.annualKwh ?? nisToKwh(billing.annualNis);
        if (annualKwh == null) {
            const monthlySum = (billing.monthly || []).reduce((sum, m) => {
                if (!m) return sum;
                const v = m.kwh ?? nisToKwh(m.nis);
                return v ? sum + v : sum;
            }, 0);
            if (monthlySum > 0) {
                annualKwh = monthlySum;
                warnings.push('לא הוזן סך שנתי ישיר - חושב מסכום הפירוט החודשי');
            }
        }
        if (annualKwh == null) {
            const deviceTotal = (payload.hourlySeries || []).reduce((s, p) => s + (p.kwh || 0), 0);
            if (deviceTotal > 0.01) {
                annualKwh = deviceTotal;
                warnings.push('לא הוזנו נתוני חיוב בפועל - הסך השנתי הוערך מנתוני המכשירים בלבד');
            }
        }

        const propertyType = client.propertyType || 'home';
        if (!client.propertyType) warnings.push('לא נבחר סוג נכס בטופס - נעשה שימוש בברירת מחדל (בית פרטי)');

        return { annualKwh: annualKwh || 0, propertyType, warnings };
    }
    
    /**
     * סינתזת סדרת זמנים שנתית מלאה ממטריצה ידנית
     * @param {Object} matrix - {summer_peak, summer_low, winter_peak, winter_low, trans_peak, trans_low}
     * @param {number} year - שנת הייחוס
     */
    function synthesizeFromMatrix(matrix, year = new Date().getFullYear()) {
        const series = [];
        const end = new Date(year + 1, 0, 1, 0, 0, 0);
        const cursor = new Date(year, 0, 1, 0, 0, 0);
        
        while (cursor < end) {
            const { season, isPeak } = classifyHour(cursor);
            // תוקן: הקוד בנה כאן "_offpeak" בעוד שהטופס (step1-view.js) אוסף
            // מפתחות שמסתיימים ב-"_off" - אי-ההתאמה איפסה את כל שעות השפל.
            const key = season + '_' + (isPeak ? 'peak' : 'off');
            const kwhPerHour = matrix[key] || 0;
            series.push({
                date: new Date(cursor),
                kwh: kwhPerHour,
                isPeak,
                season
            });
            cursor.setHours(cursor.getHours() + 1);
        }
        return series;
    }

    function _median(arr) {
        const sorted = [...arr].sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    /**
     * הורחב: מנוע איזון בין עד 3 מקורות צריכה עצמאיים - טופס JSON, סוג-נכס
     * + סך צריכה שנתי/חודשי (הזנה ישירה), ומטריצה ידנית. כל מקור שסופק
     * (לא null) תורם סך שנתי משלו; המגניטודה הסופית = חציון הסכומים
     * (זהה מתמטית לממוצע עם 2 מקורות; עם 3 - מתעלם אוטומטית מערך חריג
     * בודד). הצורה (shape) נלקחת מהמקור העשיר ביותר שסופק: מטריצה (מבדילה
     * פסגה/שפל/עונה) אם קיימת, אחרת פרופיל סוג-הנכס. אין "ניחוש" כמותי -
     * זו נוסחת איזון גסה שהוחלט עליה בהיעדר נתוני עבר לכיול משקלים מדויק
     * יותר (ראו הערה בקוד הקורא).
     * @param {Object} estimates - {json: {annualKwh,propertyType}|null, annual: {annualKwh,propertyType}|null, matrix: {annualKwh,series}|null}
     * @param {number} year
     * @returns {{series: Array, propertyType: string, combinedAnnualKwh: number, sourcesUsed: string[], propertyTypeConflict: boolean}|null}
     */
    function combineConsumptionSources(estimates, year = new Date().getFullYear()) {
        const present = Object.entries(estimates).filter(([, v]) => v != null && v.annualKwh > 0);
        if (present.length === 0) return null;

        const totals = present.map(([, v]) => v.annualKwh);
        const combinedAnnualKwh = _median(totals);

        // רזולוציית סוג נכס: אם JSON וההזנה הישירה שניהם קיימים וסותרים,
        // עדיפות להזנה הידנית (annual) - הנחה שהיא דריסה מכוונת של המייעץ.
        const propertyTypeCandidates = present
            .filter(([k]) => k === 'json' || k === 'annual')
            .map(([, v]) => v.propertyType)
            .filter(Boolean);
        const propertyTypeConflict = new Set(propertyTypeCandidates).size > 1;
        const propertyType = estimates.annual?.propertyType || estimates.json?.propertyType || 'home';

        let baseSeries;
        if (estimates.matrix) {
            baseSeries = estimates.matrix.series;
        } else {
            baseSeries = synthesizeFromAnnual(combinedAnnualKwh, propertyType, year);
        }
        const baseTotal = baseSeries.reduce((s, p) => s + p.kwh, 0);
        const scale = baseTotal > 0 ? combinedAnnualKwh / baseTotal : 1;
        const series = baseSeries.map(p => ({ ...p, kwh: p.kwh * scale }));

        return {
            series, propertyType, combinedAnnualKwh,
            sourcesUsed: present.map(([k]) => k),
            sourceBreakdown: Object.fromEntries(present.map(([k, v]) => [k, v.annualKwh])),
            propertyTypeConflict
        };
    }

    /**
     * הורחב: ניתוח "מצב עבר בשבתות" - ממוצע צריכה ליום שבת מול יום חול,
     * מחושב מהסדרה בפועל (בין אם מקורה בנתוני חח"י/טופס אמיתיים, ובין אם
     * מפרופיל מסונתז) - אך מסומן בבירור אם ההיסטוריה אמיתית או מבוססת-מודל,
     * כדי שלא תוצג הערכה מסונתזת כאילו הייתה תצפית עבר אמיתית.
     * @param {Array<{date:Date, kwh:number, isShabbat:boolean}>} series
     * @param {boolean} isRealHistoricalData - true עבור מקור חח"י/JSON עם מכשירים
     * @returns {{avgShabbatDayKwh:number, avgWeekdayKwh:number, pctDifference:number, isRealHistoricalData:boolean, shabbatDayCount:number}}
     */
    function analyzeHistoricalShabbatConsumption(series, isRealHistoricalData) {
        const shabbatDays = {}, weekdayDays = {};
        series.forEach(p => {
            const key = p.date.getFullYear() + '-' + p.date.getMonth() + '-' + p.date.getDate();
            const bucket = p.isShabbat ? shabbatDays : weekdayDays;
            bucket[key] = (bucket[key] || 0) + p.kwh;
        });
        const shabbatTotals = Object.values(shabbatDays);
        const weekdayTotals = Object.values(weekdayDays);
        const avgShabbatDayKwh = shabbatTotals.length ? shabbatTotals.reduce((a, b) => a + b, 0) / shabbatTotals.length : 0;
        const avgWeekdayKwh = weekdayTotals.length ? weekdayTotals.reduce((a, b) => a + b, 0) / weekdayTotals.length : 0;
        const pctDifference = avgWeekdayKwh > 0 ? ((avgShabbatDayKwh - avgWeekdayKwh) / avgWeekdayKwh) * 100 : 0;
        return {
            avgShabbatDayKwh, avgWeekdayKwh, pctDifference,
            isRealHistoricalData: !!isRealHistoricalData,
            shabbatDayCount: shabbatTotals.length
        };
    }

    /**
     * תוקן: הוחלף לחלוטין - הגרסה הקודמת סיפקה מספר יחיד (ממוצע-שבת מוכפל
     * באחוז) ללא שום רגישות לשבוע הספציפי או להתפלגות השעות. כעת: לכל יום
     * שבת (שבת קלנדרי, dow=6) בנפרד, מחושב הפרופיל השעתי הממוצע (24 ערכים)
     * על פני ששת ימי החול שקדמו לו (ראשון עד שישי של אותו שבוע בדיוק - לא
     * ממוצע גלובלי על פני כל השנה), וכל שעה מוכפלת באחוז מהסליידר בנפרד -
     * כך שההתפלגות בין שעות שפל/פסגה (הרלוונטית לתעריף) של השבת המוערכת
     * תואמת את הדפוס האמיתי של אותו שבוע הספציפי, לא שטוחה על פני היממה.
     * דוגמה: אם שעה 18:00 בממוצע 6 הימים הקודמים הייתה 100 קוט"ש ושעה
     * 19:00 הייתה 200, וסליידר ה-% הוגדר ל-15 - התוצאה: 115 ו-230 בהתאמה.
     * @param {Array<{date:Date, kwh:number}>} series - הסדרה המלאה (ממוין)
     * @param {number} pctIncrease - אחוז תוספת/הפחתה מהסליידר (יכול להיות שלילי)
     * @returns {Array<{date:Date, kwh:number}>} - רק שעות השבת המוערכות (24 לכל שבת קלנדרי בסדרה)
     */
    function estimateShabbatProfileWeekly(series, pctIncrease) {
        const byDate = {}; // 'y-m-d' -> {0:kwh,...,23:kwh}
        series.forEach(p => {
            const key = p.date.getFullYear() + '-' + p.date.getMonth() + '-' + p.date.getDate();
            if (!byDate[key]) byDate[key] = {};
            byDate[key][p.date.getHours()] = p.kwh;
        });

        const saturdays = new Set();
        series.forEach(p => {
            if (p.date.getDay() === 6) {
                saturdays.add(p.date.getFullYear() + '-' + p.date.getMonth() + '-' + p.date.getDate());
            }
        });

        const result = [];
        saturdays.forEach(satKey => {
            const [y, m, d] = satKey.split('-').map(Number);
            const satDate = new Date(y, m, d);

            const hourSums = new Array(24).fill(0);
            const hourCounts = new Array(24).fill(0);
            for (let back = 1; back <= 6; back++) {
                const prevDate = new Date(satDate);
                prevDate.setDate(prevDate.getDate() - back);
                const prevKey = prevDate.getFullYear() + '-' + prevDate.getMonth() + '-' + prevDate.getDate();
                const dayData = byDate[prevKey];
                if (!dayData) continue;
                for (let h = 0; h < 24; h++) {
                    if (dayData[h] !== undefined) {
                        hourSums[h] += dayData[h];
                        hourCounts[h]++;
                    }
                }
            }

            for (let h = 0; h < 24; h++) {
                if (hourCounts[h] === 0) continue; // אין נתוני עבר לשעה זו באותו שבוע - מדלגים
                const avgHour = hourSums[h] / hourCounts[h];
                result.push({
                    date: new Date(satDate.getFullYear(), satDate.getMonth(), satDate.getDate(), h),
                    kwh: avgHour * (1 + pctIncrease / 100)
                });
            }
        });

        result.sort((a, b) => a.date - b.date);
        return result;
    }

    /**
     * מיזוג הפרופיל המוערך חזרה לתוך הסדרה המלאה - מחליף את ערכי השבת
     * (Saturday) הקיימים באלו שחושבו ע"י estimateShabbatProfileWeekly,
     * ומשאיר את כל שאר השעות (כולל יום שישי) ללא שינוי.
     * @param {Array} series
     * @param {number} pctIncrease
     * @returns {Array} סדרה חדשה (לא משנה את המקור)
     */
    function applyShabbatEstimateToSeries(series, pctIncrease) {
        const estimated = estimateShabbatProfileWeekly(series, pctIncrease);
        const estimatedMap = new Map(estimated.map(p => [p.date.getTime(), p.kwh]));
        return series.map(p => {
            if (p.date.getDay() === 6 && estimatedMap.has(p.date.getTime())) {
                return { ...p, kwh: estimatedMap.get(p.date.getTime()) };
            }
            return p;
        });
    }
    
    /**
     * סינתזה מסך צריכה שנתי + סוג נכס
     * אלגוריתם: IPF (Iterative Proportional Fitting)
     * הנחה: התפלגות לפי סוג נכס (מאומת מול המקור)
     */
    function synthesizeFromAnnual(annualKwh, propertyType, year = new Date().getFullYear()) {
        const distRow = C.PROPERTY_TYPES[propertyType];
        if (!distRow) return [];
        
        // בניית מערך שעתי עם משקלים ראשוניים
        const hours = [];
        const end = new Date(year + 1, 0, 1, 0, 0, 0);
        const cursor = new Date(year, 0, 1, 0, 0, 0);
        
        while (cursor < end) {
            const { season, isPeak, isShabbat } = classifyHour(cursor);
            const isWeekday = !isShabbat;
            
            // משקל התחלתי = עונה × פסגה/שפל × חול/סוף שבוע
            const seasonShare = distRow[season];
            let peakShare;
            if (season === 'winter') {
                peakShare = isPeak ? distRow.peakWinter : distRow.offpeakWinter;
            } else if (season === 'summer') {
                peakShare = isPeak ? distRow.peakSummer : distRow.offpeakSummer;
            } else {
                // עונת מעבר - אין ערך ייעודי, ממוצע בין חורף לקיץ
                peakShare = isPeak 
                    ? (distRow.peakWinter + distRow.peakSummer) / 2
                    : (distRow.offpeakWinter + distRow.offpeakSummer) / 2;
            }
            const dayShare = isWeekday ? distRow.weekday : distRow.weekend;
            
            hours.push({
                date: new Date(cursor),
                season,
                isPeak,
                isWeekday,
                weight: seasonShare * peakShare * dayShare
            });
            cursor.setHours(cursor.getHours() + 1);
        }
        
        // 15 סבבי כיול IPF
        const seasons = ['winter', 'summer', 'transition'];
        for (let iter = 0; iter < 15; iter++) {
            // כיול עונה
            const totalWeight = hours.reduce((s, h) => s + h.weight, 0) || 1;
            seasons.forEach(season => {
                const group = hours.filter(h => h.season === season);
                const currentShare = group.reduce((s, h) => s + h.weight, 0) / totalWeight;
                if (currentShare > 0) {
                    const scale = distRow[season] / currentShare;
                    group.forEach(h => h.weight *= scale);
                }
            });
            
            // כיול פסגה/שפל בתוך חורף וקיץ
            ['winter', 'summer'].forEach(season => {
                const seasonGroup = hours.filter(h => h.season === season);
                const seasonTotal = seasonGroup.reduce((s, h) => s + h.weight, 0) || 1;
                [true, false].forEach(isPeak => {
                    const subGroup = seasonGroup.filter(h => h.isPeak === isPeak);
                    const currentShare = subGroup.reduce((s, h) => s + h.weight, 0) / seasonTotal;
                    const target = isPeak 
                        ? distRow[season === 'winter' ? 'peakWinter' : 'peakSummer']
                        : distRow[season === 'winter' ? 'offpeakWinter' : 'offpeakSummer'];
                    if (currentShare > 0) {
                        const scale = target / currentShare;
                        subGroup.forEach(h => h.weight *= scale);
                    }
                });
            });
            
            // כיול חול/סוף-שבוע
            const dayTotal = hours.reduce((s, h) => s + h.weight, 0) || 1;
            [true, false].forEach(isWeekday => {
                const group = hours.filter(h => h.isWeekday === isWeekday);
                const currentShare = group.reduce((s, h) => s + h.weight, 0) / dayTotal;
                const target = isWeekday ? distRow.weekday : distRow.weekend;
                if (currentShare > 0) {
                    const scale = target / currentShare;
                    group.forEach(h => h.weight *= scale);
                }
            });
        }
        
        // המרה לצריכה בקוט"ש
        const totalWeight = hours.reduce((s, h) => s + h.weight, 0);
        return hours.map(h => ({
            date: h.date,
            kwh: totalWeight > 0 ? (annualKwh * h.weight / totalWeight) : 0,
            isPeak: h.isPeak,
            season: h.season
        }));
    }
    
    /**
     * סינתזה מקלט מפורט (12 שדות)
     * חורף/קיץ × חול/שישי/שבת × פסגה/יום
     * ההנחה: בקיץ שישי-שבת אינם פסגה (כפי שמוגדר בתקנות)
     * בחורף - כל סוגי הימים כן פסגה (האנומליה המתועדת)
     */
    function synthesizeFromDetailedInput(detailed) {
        // ימי חול (כפי שהיה)
        const sumPeak = detailed.d_summer_weekday_peak || 0;
        const sumDay = detailed.d_summer_weekday_day || 0;
        const sumNight = detailed.d_summer_weekday_night || 0;
        const winPeak = detailed.d_winter_weekday_peak || 0;
        const winDay = detailed.d_winter_weekday_day || 0;
        const winNight = detailed.d_winter_weekday_night || 0;
        // תוקן: 6 שדות סופ"ש אלו היו חסרים לגמרי - הטופס ותיאור הקבוע טענו
        // "12 שדות" אך אספו וסינתזו בפועל רק 6 (חול), והחילו את ערכי החול גם
        // על שישי-שבת (בסתירה לפרופילי הצריכה של האפליקציה עצמה, שחלקם - כמו
        // בית כנסת - הם דווקא כבדי-סופ"ש). אם המשתמש לא מילא ערכי סופ"ש,
        // ברירת המחדל נשארת ערך החול (שקול להתנהגות הקודמת, לא שובר קלט ישן).
        const sumWkndDay = detailed.d_summer_weekend_day ?? sumDay;
        const sumWkndNight = detailed.d_summer_weekend_night ?? sumNight;
        const winWkndPeak = detailed.d_winter_weekend_peak ?? winPeak;
        const winWkndDay = detailed.d_winter_weekend_day ?? winDay;
        const winWkndNight = detailed.d_winter_weekend_night ?? winNight;

        const transPeak = (sumPeak + winPeak) / 2;
        const transDay = (sumDay + winDay) / 2;
        const transNight = (sumNight + winNight) / 2;
        const transWkndDay = (sumWkndDay + winWkndDay) / 2;
        const transWkndNight = (sumWkndNight + winWkndNight) / 2;
        
        const year = new Date().getFullYear();
        const series = [];
        const end = new Date(year + 1, 0, 1, 0, 0, 0);
        const cursor = new Date(year, 0, 1, 0, 0, 0);
        
        while (cursor < end) {
            const { season, isPeak, isShabbat } = classifyHour(cursor);
            const hour = cursor.getHours();
            
            let kwh = 0;
            
            if (season === 'summer') {
                if (isShabbat) {
                    // בקיץ שישי-שבת לעולם אינם פסגה (classifyHour) - ערכי סופ"ש ייעודיים
                    kwh = (hour >= 9 && hour < 17) ? sumWkndDay : sumWkndNight;
                } else {
                    if (isPeak) kwh = sumPeak;
                    else if (hour >= 9 && hour < 17) kwh = sumDay;
                    else kwh = sumNight;
                }
            } else if (season === 'winter') {
                // חורף: אנומליית "פסגה גם בסופ"ש" - עכשיו עם ערכי סופ"ש ייעודיים, לא ערכי חול
                if (isShabbat) {
                    if (isPeak) kwh = winWkndPeak;
                    else if (hour >= 9 && hour < 17) kwh = winWkndDay;
                    else kwh = winWkndNight;
                } else {
                    if (isPeak) kwh = winPeak;
                    else if (hour >= 9 && hour < 17) kwh = winDay;
                    else kwh = winNight;
                }
            } else {
                // מעבר - רק ימי חול פסגה
                if (isShabbat) {
                    kwh = (hour >= 9 && hour < 17) ? transWkndDay : transWkndNight;
                } else {
                    if (isPeak) kwh = transPeak;
                    else if (hour >= 9 && hour < 17) kwh = transDay;
                    else kwh = transNight;
                }
            }
            
            series.push({
                date: new Date(cursor),
                kwh,
                isPeak,
                season,
                isShabbat
            });
            cursor.setHours(cursor.getHours() + 1);
        }
        return series;
    }
    
    return {
        parseIsraelDate,
        classifyHour,
        computeSeasonalPeakDayCounts,
        parseMeterFile,
        extractCustomerMetadata,
        findDataStartIndex,
        detectGenericColumns,
        decryptConsumptionEnvelope,
        extractAnnualEstimateFromSurveyPayload,
        synthesizeFromMatrix,
        combineConsumptionSources,
        analyzeHistoricalShabbatConsumption,
        estimateShabbatProfileWeekly,
        applyShabbatEstimateToSeries,
        synthesizeFromAnnual,
        synthesizeFromDetailedInput
    };
})();

/* ====================================================================
   SOLAR SIMULATOR - מנוע חישוב תפוקה סולארית
   
   מבוסס על:
   - 1600 קוט"ש/קוו"ט/שנה (תפוקה בסיסית, אומת מול המקור)
   - 12 פקטורים חודשיים (ינואר=0.66 → יולי=1.29)
   - 12 פקטורים שעתיים (06:00=0.01 → 12:00=0.16)
   - בלאי שנתי לינארי 0.25%
   - תיקוני אזימוט והצללה
   ==================================================================== */

const SolarSimulator = (function() {
    const C = AppConstants;
    
    /**
     * חישוב תפוקה שנתית צפויה
     * @param {number} kwp - הספק מותקן (קוו"ט DC)
     * @param {number} azimuth - מקדם כיוון (1.0=דרום, 0.85=מזרח/מערב)
     * @param {number} shading - מקדם הצללה (0.5-1.0)
     * @param {Object} [ratios] - הורחב: דריסה אופציונלית של יחסי תשואה
     *   ({yieldBase, m2PerKwp}) - לשימוש בשלב 1 בעת הערכת ייצור ממערכת
     *   קיימת עם פאנלים ישנים (יעילות נמוכה יותר מהתקן המודרני). בהיעדר
     *   דריסה - משתמש בברירת המחדל המודרנית הקיימת (C.SOLAR), בדיוק כפי
     *   שכל קריאה קיימת (כולל שלב 2, למערכת החדשה) כבר עושה ללא שינוי.
     */
    function calcAnnualYield(kwp, azimuth = 1.0, shading = 0.95, ratios = {}) {
        const yieldBase = ratios.yieldBase ?? C.SOLAR.yieldBase;
        return kwp * yieldBase * azimuth * shading;
    }
    
    /**
     * חישוב גודל מערכת משטח גג
     */
    function calcRoofArea(kwp, ratios = {}) {
        const m2PerKwp = ratios.m2PerKwp ?? C.SOLAR.m2PerKwp;
        return kwp * m2PerKwp;
    }
    
    /**
     * חישוב גודל מערכת משטח גג (הפוך)
     */
    function calcKwpFromRoof(roofArea, ratios = {}) {
        const m2PerKwp = ratios.m2PerKwp ?? C.SOLAR.m2PerKwp;
        return roofArea / m2PerKwp;
    }
    
    /**
     * סימולציית תפוקה לתקופה מסוימת
     * @param {Date} startDate
     * @param {Date} endDate
     * @param {number} kwp - הספק מותקן
     * @param {number} azimuth
     * @param {number} shading
     * @returns {Object} {daily, hourly} סדרות תפוקה
     */
    function simulateYieldPeriod(startDate, endDate, kwp, azimuth = 1.0, shading = 0.95) {
        const annualYield = calcAnnualYield(kwp, azimuth, shading);
        const dailyAvg = annualYield / 365;
        const mFactors = C.SOLAR.monthlyFactors;
        const hourlyProfile = C.SOLAR.hourlyProfile; // 6:00-17:00, 12 ערכים
        
        const daily = [];
        const hourly = [];
        const cursor = new Date(startDate);
        
        // ולידציה
        const diffDays = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24));
        if (diffDays > 366) {
            throw new Error('טווח תצוגה מקסימלי: שנה (365 ימים)');
        }
        
        while (cursor <= endDate) {
            const month = cursor.getMonth();
            const dailyVal = dailyAvg * mFactors[month];
            const dateStr = formatDateIL(cursor);
            const dayName = getDayName(cursor);
            
            daily.push({ date: dateStr, day: dayName, yield: dailyVal });
            
            // 12 שעות ייצור (06:00-17:00)
            for (let i = 0; i < 12; i++) {
                const hour = 6 + i;
                const hourYield = dailyVal * hourlyProfile[i];
                const timeStr = String(hour).padStart(2, '0') + ':00';
                hourly.push({ date: dateStr, time: timeStr, yield: hourYield });
            }
            
            cursor.setDate(cursor.getDate() + 1);
        }
        
        return { daily, hourly };
    }
    
    /**
     * סימולציית תפוקה שעתית מלאה (24 שעות ליום), בפורמט זהה לסדרת הצריכה
     * (Date object + קוט"ש), לצורך מיזוג ישיר עם נתוני צריכה לפי timestamp.
     * בשונה מ-simulateYieldPeriod (שמחזירה רק 12 שעות אור יום כמחרוזות
     * תאריך), פונקציה זו מחזירה בדיוק 24 רשומות ליום (שעות ללא ייצור
     * מקבלות 0), עם Date object אמיתי לכל שעה.
     * @param {Date} startDate
     * @param {Date} endDate
     * @param {number} kwp - הספק מותקן (קוו"ט DC)
     * @param {number} azimuth
     * @param {number} shading
     * @param {Object} [ratios] - ראו הערה ב-calcAnnualYield
     * @returns {Array<{date: Date, kwh: number}>}
     */
    function simulateYieldSeries(startDate, endDate, kwp, azimuth = 1.0, shading = 0.95, ratios = {}) {
        const annualYield = calcAnnualYield(kwp, azimuth, shading, ratios);
        const dailyAvgBase = annualYield / 365;
        const mFactors = C.SOLAR.monthlyFactors;
        const hourlyProfile = C.SOLAR.hourlyProfile; // 12 ערכים, שעות 06:00-17:00

        const series = [];
        const cursor = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate(), 0, 0, 0);
        const end = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate(), 23, 0, 0);

        while (cursor <= end) {
            const hour = cursor.getHours();
            let kwh = 0;
            if (hour >= 6 && hour < 18) {
                const month = cursor.getMonth();
                const dailyVal = dailyAvgBase * mFactors[month];
                kwh = dailyVal * hourlyProfile[hour - 6];
            }
            series.push({ date: new Date(cursor), kwh });
            cursor.setHours(cursor.getHours() + 1);
        }
        return series;
    }

    /**
     * הערכת תפוקה לשנה ספציפית (מבוסס בלאי)
     * @param {number} baseAnnualYield - תפוקה בשנה 1
     * @param {number} year - שנה (1-25)
     */
    function calcYearlyYieldWithDegradation(baseAnnualYield, year) {
        if (year === 1) return baseAnnualYield;
        return Math.max(0, baseAnnualYield * (1 - C.SOLAR.degradation * (year - 1)));
    }
    
    // Helpers
    function formatDateIL(d) {
        return String(d.getDate()).padStart(2, '0') + '/' + 
               String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    }
    
    function getDayName(d) {
        const days = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
        return days[d.getDay()];
    }
    
    return {
        calcAnnualYield,
        calcRoofArea,
        calcKwpFromRoof,
        simulateYieldPeriod,
        simulateYieldSeries,
        calcYearlyYieldWithDegradation
    };
})();

/* ===== battery-simulator.js ===== */
/* ====================================================================
   BATTERY SIMULATOR - סימולציית אגירה שעתית (Dispatch State Machine)
   
   הערה חשובה: המודל הכלכלי המקורי בנוי סביב "הסדרה תעריפית" - מסלול בו
   100% מהתפוקה הסולארית נמכרת לרשת במדרגות התעריף (מחושב בנפרד במנוע ה-25 שנה).
   האגירה, במסלול הזה, היא מנגנון נפרד לחלוטין: נטענת מהרשת בשעות שפל
   (זול) ומספקת לצריכה העצמית בשעות פסגה (במקום לקנות ביוקר).
   
   הסימולציה הזו ממוקדת אך ורק בזרימת אגירה מול צריכה בפועל, ואינה מנסה
   לשלב ייצור סולארי (זה תפקידו של מנוע ה-25 שנה).
   ==================================================================== */

const BatterySimulator = (function() {
    const C = AppConstants;
    
    /**
     * סימולציית דיספאץ' שעתית של סוללה מול סדרת צריכה
     * 
     * @param {Array} series - סדרת נקודות צריכה (כל אחת עם date, kwh, isPeak)
     * @param {number} batteryUsableKwh - קיבולת שמישה בקוט"ש
     * @param {Date} rangeStart - תאריך התחלה
     * @param {Date} rangeEnd - תאריך סיום
     * @param {number} maxRateKw - הספק ממיר (0=חישוב אוטומטי לפי cRate)
     * @returns {Object} {totals, monthly, dailySamples, dailyTouAgg}
     */
    function simulateDispatch(series, batteryUsableKwh, rangeStart, rangeEnd, maxRateKw = 0) {
        const batteryNominalKwh = batteryUsableKwh > 0 ? batteryUsableKwh / C.BATTERY.dod : 0;
        const reserveKwh = batteryNominalKwh - batteryUsableKwh;
        const rateKw = (maxRateKw > 0) ? maxRateKw : Math.max(batteryNominalKwh * C.BATTERY.cRate, 0.1);
        const effCharge = C.BATTERY.effCharge;
        const effDischarge = C.BATTERY.effDischarge;
        
        // איתור רזולוציה (שעה/חצי שעה/רבע)
        const stepHours = detectStepHours(series);
        
        // חישוב State of Charge (SoC) התחלתי - מינימום
        let soc = reserveKwh;
        
        const totals = {
            consumption: 0, imported: 0, 
            peakConsumption: 0, offpeakConsumption: 0,
            unmetPeak: 0, charged: 0, discharged: 0,
            baselineCost: 0, costWithBattery: 0,
            stepCount: 0,
            batteryNominalKwh, reserveKwh, maxRateKw: rateKw
        };
        
        const monthly = {};
        const dailySamples = {};
        const dailyTouAgg = {};
        
        for (let idx = 0; idx < series.length; idx++) {
            const point = series[idx];
            const d = point.date;
            if (d < rangeStart || d > rangeEnd) continue;
            
            const consumption = Math.max(0, point.kwh);
            const { season, isPeak } = point;
            const tariff = isPeak ? C.TOU[season + '_peak'] : C.TOU[season + '_low'];
            
            let charged = 0, discharged = 0, imported;
            
            if (batteryUsableKwh > 0 && !isPeak) {
                // שעת שפל - טעינה
                // תוקן: הקוד הקודם הגביל את chargeAmount ל-"room" (פער ה-SoC, בצד ה-DC)
                // אך אז חילק שוב ב-effCharge בחישוב ה-imported - כפל הפסד יעילות.
                // כעת chargeAmount הוא בצד הרשת (AC) מלכתחילה: הגבלה ל-room/effCharge
                // מבטיחה שאם ננצל את מלוא הקיבולת, ה-SoC יגיע בדיוק ל-batteryNominalKwh
                // (room/effCharge × effCharge = room), ו-imported = צריכה + מה שנמשך
                // בפועל לטעינה - בדיוק כמו בצד הפריקה למטה (consumption - discharged).
                const room = Math.max(0, batteryNominalKwh - soc);
                const chargeAmount = Math.min(rateKw * stepHours, room / effCharge);
                charged = chargeAmount;
                soc += charged * effCharge;
                imported = consumption + charged;
            } else if (batteryUsableKwh > 0 && isPeak) {
                // שעת פסגה - פריקה
                const available = Math.max(0, soc - reserveKwh);
                const maxDischargeEnergy = Math.min(available, rateKw * stepHours);
                const deliverable = maxDischargeEnergy * effDischarge;
                discharged = Math.min(consumption, deliverable);
                const socDrop = discharged > 0 ? discharged / effDischarge : 0;
                soc -= socDrop;
                // הצריכה מהרשת = ביקוש - מה שסיפקנו מהסוללה
                imported = Math.max(0, consumption - discharged);
            } else {
                imported = consumption;
            }
            
            // עדכון totals
            totals.consumption += consumption;
            totals.imported += imported;
            totals.charged += charged;
            totals.discharged += discharged;
            totals.stepCount++;
            
            if (isPeak) {
                totals.peakConsumption += consumption;
                totals.unmetPeak += Math.max(0, consumption - discharged);
            } else {
                totals.offpeakConsumption += consumption;
            }
            
            totals.baselineCost += consumption * tariff;
            totals.costWithBattery += imported * tariff;
            
            // אגרגציה חודשית
            const mKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            if (!monthly[mKey]) {
                monthly[mKey] = { 
                    consumption: 0, imported: 0, 
                    charged: 0, discharged: 0, 
                    peakConsumption: 0, 
                    baselineCost: 0, costWithBattery: 0 
                };
            }
            const mo = monthly[mKey];
            mo.consumption += consumption;
            mo.imported += imported;
            mo.charged += charged;
            mo.discharged += discharged;
            mo.baselineCost += consumption * tariff;
            mo.costWithBattery += imported * tariff;
            if (isPeak) mo.peakConsumption += consumption;
            
            // אגרגציה יומית להצגה
            const dKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            if (!dailySamples[dKey]) dailySamples[dKey] = [];
            dailySamples[dKey].push({
                hour: d.getHours() + d.getMinutes() / 60,
                consumption,
                soc,
                charged,
                discharged,
                imported,
                isPeak,
                season
            });
            
            // אגרגציה ל-3 שורות הסטטיסטיקה
            if (!dailyTouAgg[dKey]) {
                dailyTouAgg[dKey] = { peak: 0, offPeak: 0, day: getDayName(d), total: 0 };
            }
            if (isPeak) dailyTouAgg[dKey].peak += consumption;
            else dailyTouAgg[dKey].offPeak += consumption;
            dailyTouAgg[dKey].total += consumption;
        }
        
        totals.batteryArbitrageValue = totals.baselineCost - totals.costWithBattery;
        totals.peakCoveragePct = totals.peakConsumption > 0 
            ? (1 - totals.unmetPeak / totals.peakConsumption) * 100 
            : 0;
        totals.annualCycles = batteryUsableKwh > 0 
            ? totals.discharged / batteryUsableKwh 
            : 0;
        
        return { totals, monthly, dailySamples, dailyTouAgg, stepHours };
    }
    
    /**
     * זיהוי אוטומטי של רזולוציית הסדרה (שעה/חצי שעה/רבע)
     */
    function detectStepHours(series) {
        if (series.length < 2) return 1;
        const gapCounts = {};
        const limit = Math.min(series.length, 500);
        for (let i = 1; i < limit; i++) {
            const gapMin = Math.round((series[i].date - series[i - 1].date) / 60000);
            if (gapMin > 0) gapCounts[gapMin] = (gapCounts[gapMin] || 0) + 1;
        }
        let bestGap = 60, bestCount = 0;
        for (const g in gapCounts) {
            if (gapCounts[g] > bestCount) {
                bestCount = gapCounts[g];
                bestGap = parseInt(g, 10);
            }
        }
        return bestGap / 60;
    }
    
    /**
     * חישוב ערך ארביטראז' גנרי (fallback כשאין סימולציה שעתית)
     * הערה: נוסחה גסה יותר, מבוססת על ממוצע הפער בין פסגה לשפל במשך ימי פסגה בשנה
     */
    function calcGenericArbitrageValue(usableKwh, peakDayCounts, wDayOffPrice = C.TOU.winter_low) {
        if (usableKwh <= 0) return 0;
        const roundTripEff = C.BATTERY.effCharge * C.BATTERY.effDischarge;
        let value = 0;
        
        const seasons = [
            { key: 'winter', peak: C.TOU.winter_peak, low: C.TOU.winter_low, days: peakDayCounts.winter },
            { key: 'summer', peak: C.TOU.summer_peak, low: C.TOU.summer_low, days: peakDayCounts.summer },
            { key: 'transition', peak: C.TOU.transition_peak, low: C.TOU.transition_low, days: peakDayCounts.transition }
        ];
        
        for (const s of seasons) {
            const spread = s.peak - (s.low / roundTripEff);
            if (spread > 0 && s.days > 0) {
                value += usableKwh * s.days * spread;
            }
        }
        return value;
    }
    
    /**
     * הערכת גודל סוללה אופטימלי לפי דרישות שבת/חג
     * @param {number} shabbatLoadKwh - צריכת שבת בקוט"ש
     * @param {boolean} useHoliday - האם נדרש גם חג (יומיים)
     * @param {boolean} useShabbat - האם נדרש גיבוי שבת
     */
    function suggestBatterySize(shabbatLoadKwh, useHoliday = false, useShabbat = false) {
        if (useHoliday) return (shabbatLoadKwh * 2.2) / C.BATTERY.dod;
        if (useShabbat) return (shabbatLoadKwh * 1.2) / C.BATTERY.dod;
        return 0;
    }
    
    function getDayName(d) {
        const days = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
        return days[d.getDay()];
    }
    
    return {
        simulateDispatch,
        detectStepHours,
        calcGenericArbitrageValue,
        suggestBatterySize
    };
})();
